    color: #8b949e;

    left: 50%;
    transform: translateX(-50%);
    background: #238636;
    color: white;
    padding: 12px 20px;
    border-radius: 6px;

// ================= STATE =================

const STORAGE_KEY = 'rtklib_sprint_planner_v1';

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return JSON.parse(saved);
  } catch (e) {}
  // default state = positions encoded in FINDINGS
  return {};
}

function saveState() {
  const positions = {};
  document.querySelectorAll('.card').forEach(card => {
    const sprint = card.closest('.column').dataset.sprint;
    positions[card.dataset.id] = sprint;
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(positions));
}

function applyState() {
  const positions = loadState();
  FINDINGS.forEach(f => {
    if (positions[f.id]) f.sprint = positions[f.id];
  });
}

// ================= RENDER =================

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  SPRINTS.forEach(s => {
    const col = document.createElement('div');
    col.className = 'column';
    col.dataset.sprint = s.id;
    col.innerHTML = `
      <h2>
        <span>${s.title}</span>
        <span class="meta count" data-count></span>
      </h2>
      <div class="meta">${s.subtitle}</div>
      <div class="cards"></div>
    `;
    board.appendChild(col);

    col.addEventListener('dragover', e => {
      e.preventDefault();
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', e => {
      col.classList.remove('drag-over');
    });
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const card = document.querySelector(`[data-id="${id}"]`);
      if (card) {
        col.querySelector('.cards').appendChild(card);
        const finding = FINDINGS.find(f => f.id === id);
        if (finding) finding.sprint = col.dataset.sprint;
        saveState();
        updateCounts();
      }
    });
  });

  FINDINGS.forEach(f => renderCard(f));
  updateCounts();
}

function renderCard(f) {
  const col = document.querySelector(`[data-sprint="${f.sprint}"] .cards`);
  if (!col) return;

  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.dataset.id = f.id;

  const typeLabel = {
    cherry: 'cherry-pick',
    custom: 'patch maison',
    flag:   'flag compil',
    config: 'config runtime',
    eval:   'eval/audit'
  }[f.type] || f.type;

  const commitsHtml = f.commits ? f.commits.map(c => `<span class="badge">${c}</span>`).join('') : '';
  const filesHtml = f.files && f.files.length ? `<div class="meta-line">📁 ${f.files.join(', ')}</div>` : '';
  const locHtml = f.loc ? ` • ${f.loc} LOC` : '';

  card.innerHTML = `
    <div class="header-row">
      <span class="severity ${f.sev}"></span>
      <div class="title">${f.title}</div>
    </div>
    <div class="badges">
      <span class="badge type-${f.type}">${typeLabel}</span>
      ${commitsHtml}
    </div>
    <div class="summary">${f.summary}</div>
    ${filesHtml}
    <details>
      <summary>Justification${locHtml}</summary>
      <div class="expanded">${f.rationale || ''}</div>
    </details>
  `;

  card.addEventListener('dragstart', e => {
    card.classList.add('dragging');
    e.dataTransfer.setData('text/plain', f.id);
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', e => {
    card.classList.remove('dragging');
  });

  col.appendChild(card);
}

function updateCounts() {
  document.querySelectorAll('.column').forEach(col => {
    const n = col.querySelectorAll('.card').length;
    const counter = col.querySelector('[data-count]');
    if (counter) counter.textContent = `${n}`;
  });
}

// ================= MARKDOWN EXPORT =================

function generateMarkdown() {
  const sevLabel = { critical: '🔴', high: '🟠', medium: '🟡', low: '🟢', info: 'ℹ️' };
  const typeLabel = {
    cherry: 'cherry-pick',
    custom: 'patch maison',
    flag:   'flag compil',
    config: 'config runtime',
    eval:   'eval/audit'
  };

  let md = `# Plan Sprint RTKLIB — 6c53 → HEAD\n\n`;
  md += `> Plan généré depuis sprint_planner.html — ${new Date().toISOString().slice(0,10)}\n\n`;

  SPRINTS.forEach(s => {
    const items = [];
    document.querySelectorAll(`[data-sprint="${s.id}"] .card`).forEach(card => {
      const f = FINDINGS.find(x => x.id === card.dataset.id);
      if (f) items.push(f);
    });
    if (items.length === 0 && s.id !== 'backlog') return;

    md += `## ${s.title} — ${s.subtitle}\n\n`;
    if (items.length === 0) { md += `_Aucun finding._\n\n`; return; }

    md += `| # | Prio | Type | Titre | Commits | Fichier(s) | LOC | Justification |\n`;
    md += `|---|---|---|---|---|---|---|---|\n`;
    items.forEach((f, i) => {
      const commits = f.commits ? f.commits.map(c => `\`${c}\``).join(', ') : '—';
      const files = f.files && f.files.length ? f.files.map(x => `\`${x}\``).join(', ') : '—';
      const loc = f.loc ? `~${f.loc}` : '—';
      md += `| ${i+1} | ${sevLabel[f.sev]} | ${typeLabel[f.type]} | ${f.title} | ${commits} | ${files} | ${loc} | ${f.rationale || ''} |\n`;
    });
    md += `\n`;
  });

  // Stats
  const counts = {};
  SPRINTS.forEach(s => {
    counts[s.id] = document.querySelectorAll(`[data-sprint="${s.id}"] .card`).length;
  });
  md += `## Statistiques\n\n`;
  SPRINTS.forEach(s => {
    md += `- **${s.title}** : ${counts[s.id]} item(s)\n`;
  });
  md += `\n_Total : ${FINDINGS.length} findings_\n`;

  return md;
}

// ================= ACTIONS =================

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

document.getElementById('copyMd').addEventListener('click', async () => {
  const md = generateMarkdown();
  try {
    await navigator.clipboard.writeText(md);
    showToast('Markdown copié !');
  } catch (e) {
    document.getElementById('mdTextarea').value = md;
    document.getElementById('mdModal').classList.add('show');
    showToast('Sélectionnez et copiez manuellement');
  }
});

document.getElementById('viewMd').addEventListener('click', () => {
  document.getElementById('mdTextarea').value = generateMarkdown();
  document.getElementById('mdModal').classList.add('show');
});

document.getElementById('copyFromModal').addEventListener('click', async () => {
  const ta = document.getElementById('mdTextarea');
  ta.select();
  try {
    await navigator.clipboard.writeText(ta.value);
    showToast('Markdown copié !');
  } catch (e) {
    document.execCommand('copy');
    showToast('Copié (fallback)');
  }
});

document.getElementById('exportJson').addEventListener('click', () => {
  const positions = {};
  FINDINGS.forEach(f => positions[f.id] = f.sprint);
  const blob = new Blob([JSON.stringify(positions, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sprint_plan_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('JSON exporté');
});

document.getElementById('importJson').addEventListener('click', () => {
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const positions = JSON.parse(ev.target.result);
      FINDINGS.forEach(f => {
        if (positions[f.id]) f.sprint = positions[f.id];
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(positions));
      renderBoard();
      showToast('JSON importé');
    } catch (err) {
      showToast('Erreur import JSON');
    }
  };
  reader.readAsText(file);
});

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Réinitialiser l\'organisation par défaut ?')) return;
  localStorage.removeItem(STORAGE_KEY);
  // Reset to default positions from FINDINGS source
  location.reload();
});

// ================= INIT =================

applyState();
renderBoard();
</script>
